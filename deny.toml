[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained, not vulnerable; gpui pulls it in through image, exr and pulp" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is unmaintained, not vulnerable; gpui depends on it directly and through usvg" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is unmaintained, not vulnerable; gpui pulls it in through usvg" },
]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "hyper" },
    { name = "reqwest" },
    { name = "ureq" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "rustls" },
    { name = "arboard" },
    { name = "windows-core", reason = "only cleanshot-win, for #[implement], besides windows and GPUI's own crates", wrappers = [
        "accesskit_windows", "cleanshot-win", "gpui_windows", "windows",
        "windows-collections", "windows-future", "windows-numerics",
    ] },
]

[[bans.features]]
crate = "tokio"
deny = ["net"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/zed-industries/zed"]
