name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A new push to a ci/ branch replaces that branch's older run. Every other ref gets a group
# of its own, so each commit on main keeps its run.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/ci/') && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Code is formatted
        run: cargo fmt --all -- --check

      - name: Install ast-grep
        run: npm install -g @ast-grep/cli@0.51.0

      - name: Code passes the ast-grep rules in sgconfig.yml
        run: ast-grep scan

      - name: Clippy reports no warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests pass on x64
        run: cargo test --workspace --no-fail-fast

      - name: Workspace builds for ARM64 (C-06)
        run: cargo build --workspace --target aarch64-pc-windows-msvc

      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny@0.19.7 cargo-audit@0.22.2

      - name: Dependencies pass bans, licences, advisories and sources (C-10, CHARTER 6)
        run: cargo deny check

      - name: No dependency has a published advisory
        run: cargo audit

  release-exe:
    # A red twin proves a test fails; only the checks job runs tests.
    if: ${{ !endsWith(github.ref, '-red') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release exe builds, with the runner's checkout, home and cargo paths remapped (CHARTER 7 gate 3)
        shell: bash
        run: >
          cargo build --release --locked -p cleanshot-app
          --config "target.x86_64-pc-windows-msvc.rustflags = ['--remap-path-prefix=$GITHUB_WORKSPACE=src', '--remap-path-prefix=$USERPROFILE=~', '--remap-path-prefix=${CARGO_HOME:-$USERPROFILE\.cargo}=cargo']"

      - name: Release exe passes the binary scan and the unsafe scan (C-02 C-10 C-11 C-16 C-17)
        shell: bash
        env:
          LLVM_BIN: C:/Program Files/LLVM/bin
        run: ./charter-gates.sh --release-exe target/x86_64-pc-windows-msvc/release/cleanshot.exe

      - name: Release exe names the product and carries the package version (D-74)
        shell: pwsh
        run: |
          $expected = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'cleanshot-app' | ForEach-Object version
          $info = (Get-Item target/x86_64-pc-windows-msvc/release/cleanshot.exe).VersionInfo
          $fixed = '{0}.{1}.{2}' -f $info.ProductMajorPart, $info.ProductMinorPart, $info.ProductBuildPart
          $found = "ProductName=$($info.ProductName) FileDescription=$($info.FileDescription) ProductVersion=$($info.ProductVersion) FileVersion=$($info.FileVersion) fixed=$fixed"
          $wanted = "ProductName=Cleanshot FileDescription=Cleanshot ProductVersion=$expected FileVersion=$expected fixed=$($expected -replace '[-+].*$', '')"
          if ($found -ne $wanted) {
            Write-Output "FAIL D-74: the exe says $found, expected $wanted"
            exit 1
          }
          Write-Output "D-74: $found"

      - name: Release exe starts and stays up until stopped (C-02)
        shell: bash
        run: |
          target/x86_64-pc-windows-msvc/release/cleanshot.exe &
          started=$!
          sleep 5
          if ! kill -0 "$started" 2>/dev/null; then
            status=0
            wait "$started" || status=$?
            echo "FAIL C-02: cleanshot.exe exited within 5 s with status $status"
            exit 1
          fi
          taskkill //F //IM cleanshot.exe

      - name: Release exe loads no DLL planted beside it, under any name it loads that is not a KnownDLL (C-12)
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/cleanshot.exe'
          $run = Join-Path $env:RUNNER_TEMP 'planted'
          New-Item -ItemType Directory -Force $run | Out-Null
          Copy-Item $exe $run
          Set-Content (Join-Path $run 'cleanshot.toml') ''
          $knownKey = 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\KnownDLLs'
          $knownValues = Get-ItemProperty $knownKey
          $known = (Get-Item $knownKey).GetValueNames() |
            ForEach-Object { $knownValues.$_ } | Where-Object { $_ -like '*.dll' } |
            ForEach-Object { $_.ToLowerInvariant() }
          Write-Output "KnownDLLs: $($known -join ' ')"
          $imports = & 'C:/Program Files/LLVM/bin/llvm-readobj.exe' --coff-imports $exe
          $static = @(); $delayed = @(); $section = ''
          foreach ($line in $imports) {
            if ($line -match '^(Delay)?Import \{') { $section = $Matches[0] }
            elseif ($line -match '^  Name: (.+)$') {
              if ($section -like 'Delay*') { $delayed += $Matches[1].ToLowerInvariant() }
              else { $static += $Matches[1].ToLowerInvariant() }
            }
          }
          Write-Output "Static imports: $($static -join ' ')"
          Write-Output "Delay-loaded imports: $($delayed -join ' ')"
          # Stop one start and wait for its exit, so the next is not a second launch (C-14).
          function Stop-Cleanshot($process) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            $process.WaitForExit(10000) | Out-Null
          }
          # Starts the copy with --log; returns the modules it holds once the tray is ready, or
          # $null if it is not ready within 10 s.
          function Start-Cleanshot {
            $log = Join-Path $run 'cleanshot.log'
            Remove-Item $log -ErrorAction SilentlyContinue
            $process = Start-Process (Join-Path $run 'cleanshot.exe') '--log' -PassThru
            $deadline = (Get-Date).AddSeconds(10)
            while ((Get-Date) -lt $deadline -and -not ((Test-Path $log) -and (Select-String -Quiet 'perf P-03' $log))) {
              Start-Sleep -Milliseconds 250
            }
            $modules = $null
            if ((Test-Path $log) -and (Select-String -Quiet 'perf P-03' $log)) {
              $process.Refresh()
              $modules = @($process.Modules | ForEach-Object FileName)
            }
            Stop-Cleanshot $process
            $modules
          }
          # The C-02 step's exe may still be exiting.
          Get-Process cleanshot -ErrorAction SilentlyContinue | ForEach-Object { Stop-Cleanshot $_ }
          $clean = Start-Cleanshot
          if ($null -eq $clean) { Write-Output 'FAIL C-12: cleanshot.exe did not start with nothing planted'; exit 1 }
          $system = [Environment]::GetFolderPath('System')
          $loaded = $clean | Where-Object { $_ -like "$system\*" } |
            ForEach-Object { [IO.Path]::GetFileName($_).ToLowerInvariant() }
          $names = @($static + $delayed + $loaded) | Sort-Object -Unique |
            Where-Object { $_ -notin $known -and $_ -notlike 'api-ms-*' -and $_ -notlike 'ext-ms-*' }
          Write-Output "Planted, one at a time: $($names -join ' ')"
          $decoy = Join-Path $system 'version.dll'
          $failed = $false
          foreach ($name in $names) {
            $planted = Join-Path $run $name
            Copy-Item $decoy $planted
            $modules = Start-Cleanshot
            Remove-Item $planted -Force
            if ($null -eq $modules) {
              Write-Output "FAIL C-12: with $name planted beside it, cleanshot.exe did not start, so it loaded the decoy"
              $failed = $true
            } elseif ($modules | Where-Object { $_ -ieq $planted }) {
              Write-Output "FAIL C-12: cleanshot.exe loaded the $name planted beside it"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Output "C-12: none of $($names.Count) planted DLLs loaded"

      - name: Budget judge builds
        run: cargo build --release --locked -p cleanshot-fieldtest

      - name: Release exe meets P-03 to P-06, judged from its size and its own --log lines (D-62)
        shell: bash
        run: |
          run="$RUNNER_TEMP/perf"
          mkdir -p "$run"
          cp target/x86_64-pc-windows-msvc/release/cleanshot.exe "$run/"
          # An empty cleanshot.toml beside the exe is portable mode (C-05), so the log lands here.
          : > "$run/cleanshot.toml"
          # C-14: while the C-02 step's exe lives, this launch would only signal it and exit.
          for _ in $(seq 20); do
            tasklist //FI "IMAGENAME eq cleanshot.exe" | grep -qi cleanshot.exe || break
            sleep 0.5
          done
          if tasklist //FI "IMAGENAME eq cleanshot.exe" | grep -qi cleanshot.exe; then
            echo "FAIL D-62: the C-02 step's cleanshot.exe is still running after 10 s"
            exit 1
          fi
          "$run/cleanshot.exe" --log &
          # D-97: P-04 and P-05 are logged 10 s after the tray is ready, which a slow cold start
          # (antivirus scanning a fresh exe) pushes back, so this waits for the line, not a time.
          for _ in $(seq 240); do
            grep -q " perf P-05 " "$run/cleanshot.log" 2>/dev/null && break
            sleep 0.5
          done
          taskkill //F //IM cleanshot.exe
          cat "$run/cleanshot.log"
          target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --budgets --runner \
            --idle "$run/cleanshot.log" --exe target/x86_64-pc-windows-msvc/release/cleanshot.exe

      - name: Upload cleanshot.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleanshot-exe
          path: target/x86_64-pc-windows-msvc/release/cleanshot.exe
          if-no-files-found: error

  probe:
    if: ${{ !endsWith(github.ref, '-red') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Field-test probe builds
        run: cargo build --release --locked -p cleanshot-fieldtest -p cleanshot-app

      - name: Release build copies a 4K region within P-02, a runner failing only over 1.5 times it (D-90)
        shell: bash
        run: |
          cargo test --release --locked -p cleanshot-app --bin cleanshot p02_ -- --nocapture | tee p02.txt
          target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --budgets --runner --copy p02.txt

      - name: Probe reports what this runner can do (D-25)
        shell: bash
        run: |
          target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --report probe.md
          cat probe.md >> "$GITHUB_STEP_SUMMARY"
          target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --start-split

      - name: Release exe meets P-01 over the probe's hotkeys, judged from its own --log lines (D-62)
        shell: bash
        run: |
          run="$RUNNER_TEMP/p01"
          mkdir -p "$run"
          cp target/x86_64-pc-windows-msvc/release/cleanshot.exe "$run/"
          # Portable mode (C-05). Ctrl+Shift+4, because the Snipping Tool may hold PrtSc (F-52).
          printf '[hotkeys]\nregion = "Ctrl+Shift+4"\n' > "$run/cleanshot.toml"
          "$run/cleanshot.exe" --log &
          # --overlays waits for the tray-ready line, then 3 s, before the first press (D-88).
          # Each press waits for the last overlay's P-01 line and for it to close, so a slow
          # overlay is measured, not raced; one that never shows or closes fails the run.
          target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --overlays "$run/cleanshot.log" || failed=$?
          # F-50: Exit from the tray closes Cleanshot, which logs that the shell removed its icon.
          # A run that did not exit is ended so the job does not hang; otherwise taskkill has
          # nothing to end.
          target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --exit "$run/cleanshot.log" || exited=$?
          taskkill //F //IM cleanshot.exe 2>/dev/null || true
          cat "$run/cleanshot.log"
          (( ${failed:-0} == 0 )) || { echo "FAIL D-62: the overlay run stopped (exit ${failed})"; exit 1; }
          (( ${exited:-0} == 0 )) || { echo "FAIL F-50: Cleanshot did not exit cleanly from its tray"; exit 1; }
          target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --budgets --runner --overlays "$run/cleanshot.log"

      - name: Upload the probe report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-report
          path: probe.md
          if-no-files-found: error

  dpi:
    if: ${{ !endsWith(github.ref, '-red') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Field-test probe and the D-71 overlay test build
        run: |
          cargo build --release --locked -p cleanshot-fieldtest -p cleanshot-app
          cargo test --release --locked -p cleanshot-win --lib --no-run

      - name: Release exe copies the full screen pixel for pixel, and the toolbar takes the scale, at 100, 125, 150 and 175% (F-01, D-71); copies survive clipboard history (F-20)
        shell: bash
        run: |
          run="$RUNNER_TEMP/dpi"
          mkdir -p "$run"
          cp target/x86_64-pc-windows-msvc/release/cleanshot.exe "$run/"
          # Portable mode (C-05). Ctrl+Shift+7 is the key the field test presses.
          printf 'after_capture = "copy"\nshow_thumbnail = false\n[hotkeys]\nfull_screen = "Ctrl+Shift+7"\n' > "$run/cleanshot.toml"
          # The hotkey works once the tray is ready, which the exe logs as P-03. A press before
          # that is lost, so wait for the line, not a fixed time; the log starts empty (C-23).
          start() {
            rm -f "$run/cleanshot.log"
            "$run/cleanshot.exe" --log &
            for _ in $(seq 120); do
              grep -q " perf P-03 " "$run/cleanshot.log" 2>/dev/null && return
              sleep 0.5
            done
            echo "FAIL: cleanshot.exe logged no P-03 line within 60 s"
            status=1
          }
          # C-14: a launch while the last exe lives would only signal it and exit.
          stop() {
            taskkill //F //IM cleanshot.exe
            for _ in $(seq 20); do
              tasklist //FI "IMAGENAME eq cleanshot.exe" | grep -qi cleanshot.exe || break
              sleep 0.5
            done
            cat "$run/cleanshot.log"
          }
          status=0
          # Scale steps from the recommended 100% at 1920x1080, and the dpi each gives (D-71).
          # Each step sets its scale, then starts its own exe, as a user launching at that scale does (D-71).
          for scale in "0 96" "1 120" "2 144" "4 168"; do
            target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --set-scale 1920 1080 $scale || { status=1; continue; }
            start
            target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --copy-at-scale 1920 1080 ${scale#* } "$run/cleanshot.log" || status=1
            CLEANSHOT_DPI=${scale#* } cargo test --release --locked -p cleanshot-win --lib -- --ignored --exact overlay::tests::d71_the_toolbar_takes_the_scale_windows_gives_the_monitor || status=1
            stop
          done
          start
          # A thread reads the clipboard on every change, as Win+V clipboard history does.
          target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --copies-while-watched 20 "$run/cleanshot.log" || status=1
          stop
          exit "$status"

