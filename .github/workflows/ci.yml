name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Code is formatted
        run: cargo fmt --all -- --check

      - name: Clippy reports no warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests pass on x64
        run: cargo test --workspace

      - name: Workspace builds for ARM64 (C-06)
        run: cargo build --workspace --target aarch64-pc-windows-msvc

      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny@0.19.7 cargo-audit@0.22.2

      - name: Dependencies pass bans, licences, advisories and sources (C-10, CHARTER 6)
        run: cargo deny check

      - name: No dependency has a published advisory
        run: cargo audit

  release-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release exe builds, with the runner's home and cargo paths remapped (C-20)
        shell: bash
        run: >
          cargo build --release --locked -p cleanshot-app
          --config "target.x86_64-pc-windows-msvc.rustflags = ['--remap-path-prefix=$USERPROFILE=~', '--remap-path-prefix=${CARGO_HOME:-$USERPROFILE\.cargo}=cargo']"

      - name: Release exe passes the binary scan, the unsafe scan and the size budget (C-02 C-10 C-11 C-16 C-17 P-06)
        shell: bash
        env:
          LLVM_BIN: C:/Program Files/LLVM/bin
        run: ./charter-gates.sh --release-exe target/x86_64-pc-windows-msvc/release/cleanshot.exe

      - name: Upload cleanshot.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cleanshot-exe
          path: target/x86_64-pc-windows-msvc/release/cleanshot.exe
          if-no-files-found: error

  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Field-test probe builds
        run: cargo build --release --locked -p cleanshot-fieldtest

      - name: Probe reports what this runner can do (D-25)
        shell: bash
        run: |
          target/x86_64-pc-windows-msvc/release/cleanshot-fieldtest.exe --report probe.md
          cat probe.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the probe report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-report
          path: probe.md
          if-no-files-found: error
