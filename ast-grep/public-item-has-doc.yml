id: public-item-has-doc
language: rust
severity: error
message: A public item in core or render needs a /// doc comment saying its contract.
files:
  - crates/cleanshot-core/src/**/*.rs
  - crates/cleanshot-render/src/**/*.rs
rule:
  all:
    - any:
        - kind: function_item
        - kind: struct_item
        - kind: enum_item
        - kind: const_item
        - kind: static_item
        - kind: trait_item
    - has:
        kind: visibility_modifier
        regex: ^pub$
    - not:
        follows:
          kind: line_comment
          regex: ^///
          stopBy:
            not:
              kind: attribute_item
    - not:
        any:
          - pattern: pub fn $NAME(&self) -> $TYPE { self.$FIELD }
          - pattern: pub fn $NAME(&self) -> $TYPE { &self.$FIELD }
